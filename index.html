  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14181f;
      --ink: #edebe0;
      --muted: #9ea3a8;
      --line: #3a414c;
      --yellow: #f7cc1a;
      --space: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
      padding: 1.5rem max(1rem, env(safe-area-inset-right)) 3rem max(1rem, env(safe-area-inset-left));
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    .studio {
      margin: 0;
      font-family: "Outfit", "Bahnschrift", "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: 0.02em;
    }
    .tag {
      margin: 0.45rem 0 0;
      color: var(--muted);
      max-width: 36rem;
    }
    .games {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      .games { grid-template-columns: 1fr 1fr; gap: 1.15rem; }
    }
    .game {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      background: #1c222c;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .game:hover { border-color: var(--yellow); transform: translateY(-1px); }
    .game:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    .game-mark {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: cover;
    }
    .game h2 {
      margin: 0;
      font-family: "Outfit", "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .game p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .badge {
      display: inline-block;
      font-family: "Outfit", "Bahnschrift", "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #141414;
      background: var(--yellow);
      padding: 0.35rem 0.55rem;
      border-radius: 4px;
      width: fit-content;
    }
    .badge.live { background: var(--space); }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--yellow); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="studio">geeks0n-byte</h1>
      <p class="tag">Small indie puzzles. Play free on the web, or on Google Play when available.</p>
    </header>

    <div class="games">
      <a class="game" href="/spaceblox/">
        <img class="game-mark" src="/spaceblox/assets/icon_512.png" width="72" height="72" alt="" />
        <span class="badge live">Out now</span>
        <h2>Spaceblox</h2>
        <p>Calm color logic in deep space. Play in browser or on Google Play.</p>
      </a>
      <a class="game" href="/shapes/">
        <img class="game-mark" src="/shapes/assets/logo_mark.png" width="72" height="72" alt="" />
        <span class="badge">Coming soon</span>
        <h2>Shapes</h2>
        <p>Match a shape. Peel a layer. Build combos.</p>
      </a>
    </div>

    <footer>
      <a href="/spaceblox/privacy-policy.html">Privacy</a>
      ·
      <button type="button" class="cookie-choice" data-consent-open>Cookies</button>
    </footer>
  </div>
  <script src="/consent.js" defer></script>
</body>
</html>
