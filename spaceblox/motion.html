<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020617" />
  <meta name="robots" content="noindex" />
  <title>Spaceblox — Motion lab</title>
  <meta name="description" content="Experimental Spaceblox motion preview — heavier starfield and ambient FX." />
  <link rel="icon" href="assets/icon_512.png" type="image/png" />
  <style>
    @font-face {
      font-family: "PressStart2P";
      src: url("assets/PressStart2P.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --bg: #0b1220;
      --panel: #172033;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --accent: #56bdf8;
      --yellow: #facc15;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #020617; min-height: 100%; }
    html, body { overflow-x: hidden; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: #020617;
      background-image:
        radial-gradient(1200px 600px at 20% -10%, #1e3a5f66, transparent),
        radial-gradient(900px 500px at 90% 10%, #312e8166, transparent),
        radial-gradient(700px 400px at 50% 80%, #0ea5e922, transparent),
        linear-gradient(180deg, var(--bg), #020617 70%);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.55;
    }

    /* Richer multi-layer starfield (page ambient) */
    .stars, .stars-far, .stars-near {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .stars-far {
      background-image:
        radial-gradient(1px 1px at 8% 14%, #fff5, transparent),
        radial-gradient(1px 1px at 22% 66%, #fff4, transparent),
        radial-gradient(1px 1px at 48% 28%, #fff5, transparent),
        radial-gradient(1px 1px at 71% 82%, #fff3, transparent),
        radial-gradient(1px 1px at 91% 36%, #fff4, transparent),
        radial-gradient(1px 1px at 35% 90%, #fff3, transparent);
      opacity: 0.45;
      animation: drift-far 90s linear infinite;
    }
    .stars {
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff8, transparent),
        radial-gradient(1px 1px at 28% 72%, #fff6, transparent),
        radial-gradient(1.5px 1.5px at 61% 24%, #fff7, transparent),
        radial-gradient(1px 1px at 78% 58%, #fff5, transparent),
        radial-gradient(1px 1px at 88% 12%, #fff6, transparent),
        radial-gradient(1.5px 1.5px at 42% 40%, #fff5, transparent),
        radial-gradient(1px 1px at 55% 55%, #fff4, transparent),
        radial-gradient(2px 2px at 17% 48%, #c4b5fd66, transparent);
      opacity: 0.65;
      animation: drift-mid 55s linear infinite, twinkle-page 8s ease-in-out infinite;
    }
    .stars-near {
      background-image:
        radial-gradient(1.5px 1.5px at 18% 30%, #fff9, transparent),
        radial-gradient(2px 2px at 64% 18%, #38bdf866, transparent),
        radial-gradient(1px 1px at 82% 70%, #fff7, transparent),
        radial-gradient(1.5px 1.5px at 40% 78%, #facc1555, transparent),
        radial-gradient(1px 1px at 95% 50%, #fff6, transparent);
      opacity: 0.5;
      animation: drift-near 32s linear infinite;
    }
    @keyframes drift-far {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-40px, 28px, 0); }
    }
    @keyframes drift-mid {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-70px, 48px, 0); }
    }
    @keyframes drift-near {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-110px, 72px, 0); }
    }
    @keyframes twinkle-page {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.8; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 1rem max(1rem, env(safe-area-inset-right)) 3.5rem max(1rem, env(safe-area-inset-left));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      max-width: min(100%, 700px);
      margin-inline: auto;
      padding: 0.85rem 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      margin-left: 2px;
    }
    .brand img {
      display: block;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 0 0 2px #334155, 0 8px 24px #0008;
    }
    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "PressStart2P", monospace;
      font-size: 0.55rem;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000a;
      white-space: nowrap;
      padding: 0.75rem;
      background-color: #1a1a1a;
      background-image: url("assets/button_bar_gray_dark.svg?v=ingame3");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    nav a:hover { filter: brightness(1.12); }

    .lab-note {
      width: 100%;
      max-width: min(100%, 700px);
      margin: 0.5rem auto 1.5rem;
      text-align: center;
    }
    .lab-note h1 {
      font-family: "PressStart2P", monospace;
      font-size: clamp(0.85rem, 2.2vw, 1.15rem);
      color: #f8fafc;
      margin: 0 0 0.75rem;
      line-height: 1.5;
    }
    .lab-note p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .lab-note .tag {
      display: inline-block;
      margin-bottom: 0.65rem;
      font-family: "PressStart2P", monospace;
      font-size: 0.48rem;
      letter-spacing: 0.06em;
      color: var(--yellow);
      border: 1px solid color-mix(in srgb, var(--yellow) 40%, var(--line));
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      background: #1a1408aa;
    }

    .hero-art {
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: #00123a;
      box-shadow: 0 20px 50px #0007, 0 0 60px #1e3a5f44;
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: min(100%, 700px);
      margin-inline: auto;
      aspect-ratio: 400 / 170;
      height: auto;
    }
    .space-banner {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #00123a;
    }
    .space-banner .sb-layer {
      position: absolute;
      inset: 0;
      background-repeat: repeat;
      --sb-tw: 720px;
      --sb-th: 1280px;
      background-size: var(--sb-tw) var(--sb-th);
      background-position: 0 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      will-change: background-position, opacity;
      pointer-events: none;
    }
    .space-banner .sb-void { position: absolute; inset: 0; background: #00123a; }
    .space-banner .sb-dust {
      background-image: url("assets/bg_1_far_dust.svg");
      opacity: 0.85;
      animation: sb-parallax-a 220s linear infinite;
    }
    .space-banner .sb-stars {
      background-image: url("assets/bg_2_medium_stars.svg");
      animation: sb-parallax-b 160s linear infinite, sb-twinkle 5.5s ease-in-out infinite;
    }
    .space-banner .sb-accents {
      background-image: url("assets/bg_3_foreground_accents.svg");
      animation: sb-parallax-c 110s linear infinite, sb-twinkle-alt 5.5s ease-in-out infinite;
    }
    .space-banner .sb-sparks {
      background-image: url("assets/bg_4_sparkler_crosses.svg");
      opacity: 1;
      animation: sb-parallax-d 75s linear infinite, sb-pulse 4.5s ease-in-out infinite;
    }
    @keyframes sb-parallax-a {
      from { background-position: 0 0; }
      to { background-position: calc(-3 * var(--sb-tw)) calc(2 * var(--sb-th)); }
    }
    @keyframes sb-parallax-b {
      from { background-position: 0 0; }
      to { background-position: calc(-4 * var(--sb-tw)) calc(2 * var(--sb-th)); }
    }
    @keyframes sb-parallax-c {
      from { background-position: 0 0; }
      to { background-position: calc(-5 * var(--sb-tw)) calc(3 * var(--sb-th)); }
    }
    @keyframes sb-parallax-d {
      from { background-position: 0 0; }
      to { background-position: calc(-6 * var(--sb-tw)) calc(3 * var(--sb-th)); }
    }
    @keyframes sb-twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes sb-twinkle-alt {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes sb-pulse {
      0%, 100% { opacity: 0.85; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.15); }
    }
    .space-banner .sb-fx {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .space-banner .sb-fx-item {
      position: absolute;
      image-rendering: pixelated;
      will-change: transform, opacity;
    }
    .space-banner .sb-title {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      pointer-events: none;
      animation: title-float 6s ease-in-out infinite;
    }
    .space-banner .sb-title img {
      display: block;
      width: min(68%, 520px);
      height: auto;
      aspect-ratio: 1080 / 180;
      filter: drop-shadow(0 0 18px #38bdf855);
    }
    @keyframes title-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Floating pixel particles over the page (subtle) */
    .particles {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 1px;
      background: #94a3b8;
      opacity: 0.35;
      image-rendering: pixelated;
      will-change: transform, opacity;
    }

    .actions {
      width: 100%;
      max-width: min(100%, 700px);
      margin: 1.75rem auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      justify-content: center;
      align-items: center;
    }
    .actions a.back {
      font-family: "PressStart2P", monospace;
      font-size: 0.55rem;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000a;
      padding: 0.85rem 1rem;
      background-color: #1a1a1a;
      background-image: url("assets/button_bar_gray_dark.svg?v=ingame3");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    .actions a.back:hover { filter: brightness(1.12); }
    .play-badge {
      display: inline-flex;
      line-height: 0;
    }
    .play-badge img {
      display: block;
      width: 168px;
      height: auto;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: space-between;
      width: 100%;
      max-width: min(100%, 700px);
      margin-inline: auto;
    }
    footer a { color: var(--accent); }

    @media (max-width: 860px) {
      .space-banner .sb-title img { width: min(88%, 420px); }
      .space-banner .sb-layer { --sb-tw: 480px; --sb-th: 853px; }
      .brand img { width: 44px; height: 44px; border-radius: 12px; }
      footer { flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; }
      .play-badge img { width: min(168px, 52vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars, .stars-far, .stars-near,
      .space-banner .sb-layer,
      .space-banner .sb-title { animation: none !important; opacity: 1 !important; filter: none !important; transform: none !important; }
      .space-banner .sb-fx,
      .particles { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="stars-far" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="stars-near" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <a class="brand" href="./" aria-label="Spaceblox home">
        <img src="assets/icon_512.png" alt="Spaceblox" width="52" height="52" />
      </a>
      <nav>
        <a href="./">BACK TO SPACEBLOX</a>
      </nav>
    </header>

    <div class="lab-note">
      <span class="tag">EXPERIMENTAL</span>
      <h1>Motion lab</h1>
      <p>
        Heavier ambient motion for the Spaceblox look — denser starfield, faster banner parallax,
        and extra particles. The main landing stays calm; this page is optional.
      </p>
    </div>

    <div class="hero-art" role="img" aria-label="SPACEBLOX title over experimental animated space background">
      <div class="space-banner" aria-hidden="true">
        <div class="sb-void"></div>
        <div class="sb-layer sb-dust"></div>
        <div class="sb-layer sb-stars"></div>
        <div class="sb-layer sb-accents"></div>
        <div class="sb-layer sb-sparks"></div>
        <div class="sb-fx" id="space-fx"></div>
        <div class="sb-title">
          <img src="assets/title_spaceblox.png" alt="SPACEBLOX" width="4320" height="720" decoding="async" />
        </div>
      </div>
    </div>

    <div class="actions">
      <a class="back" href="./">← Back to Spaceblox</a>
      <a class="play-badge" href="https://play.google.com/store/apps/details?id=com.spaceblox.game" aria-label="Get it on Google Play">
        <img src="assets/google-play-badge.png" alt="Get it on Google Play" width="215" height="83" />
      </a>
    </div>

    <footer>
      <div>© Spaceblox · Motion lab (experimental)</div>
      <div>
        <a href="./">Main site</a>
        ·
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
    </footer>
  </div>

  <script>
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var layers = document.querySelectorAll(".space-banner .sb-layer");
    for (var i = 0; i < layers.length; i++) {
      var el = layers[i];
      var durs = (getComputedStyle(el).animationDuration || "").split(",");
      var delays = [];
      for (var j = 0; j < durs.length; j++) {
        var sec = parseFloat(durs[j]);
        if (!isFinite(sec) || sec <= 0) delays.push("0s");
        else delays.push((-Math.random() * sec).toFixed(3) + "s");
      }
      if (delays.length) el.style.animationDelay = delays.join(", ");
    }
  })();
  </script>

  <script>
  (function () {
    var fx = document.getElementById("space-fx");
    if (!fx || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var ASSETS = {
      star: "assets/fx_shooting_star.svg",
      asteroids: [
        "assets/fx_asteroid_1.svg",
        "assets/fx_asteroid_2.svg",
        "assets/fx_asteroid_3.svg"
      ],
      comets: [
        "assets/fx_comet_1.svg",
        "assets/fx_comet_2.svg",
        "assets/fx_comet_3.svg"
      ]
    };
    var STAR_BASE_DEG = 135;
    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

    function spawn(kind) {
      var el = document.createElement("img");
      el.className = "sb-fx-item";
      el.alt = "";
      var w, h, dur, startX, endX, startY, endY, dx, dy, travelDeg, rot0, rot1;
      var hostW = fx.clientWidth || 1;
      var hostH = fx.clientHeight || 1;
      var m = hostW < 640 ? 0.4 : (hostW < 900 ? 0.58 : 0.82);

      if (kind === "star") {
        w = rand(30, 50) * m; h = w; dur = rand(1.1, 2.0);
        el.src = ASSETS.star;
      } else if (kind === "comet") {
        w = rand(36, 58) * m; h = w; dur = rand(2.2, 3.8);
        el.src = pick(ASSETS.comets);
      } else {
        w = rand(18, 32) * m; h = w; dur = rand(9, 16);
        el.src = pick(ASSETS.asteroids);
      }
      el.style.width = w + "px";
      el.style.height = h + "px";

      startX = hostW + w + 20;
      endX = -w - 40;
      var travelX = startX - endX;
      if (kind === "star" || kind === "comet") {
        startY = rand(-50, hostH * 0.45);
        endY = startY + travelX * rand(0.55, 1.35);
      } else {
        startY = rand(-20, hostH * 0.7);
        endY = startY + travelX * rand(0.12, 0.6);
      }
      dx = endX - startX;
      dy = endY - startY;
      travelDeg = Math.atan2(dy, dx) * 180 / Math.PI;

      if (kind === "asteroid") {
        rot0 = rand(0, 360);
        rot1 = rot0 + rand(160, 560) * (Math.random() < 0.5 ? 1 : -1);
      } else {
        rot0 = travelDeg - STAR_BASE_DEG;
        rot1 = rot0;
      }

      el.style.left = "0";
      el.style.top = "0";
      el.style.transform = "translate(" + startX + "px," + startY + "px) rotate(" + rot0 + "deg)";
      fx.appendChild(el);

      var anim = el.animate([
        { transform: "translate(" + startX + "px," + startY + "px) rotate(" + rot0 + "deg)", opacity: 1 },
        { transform: "translate(" + endX + "px," + endY + "px) rotate(" + rot1 + "deg)", opacity: 0.85 }
      ], { duration: dur * 1000, easing: "linear", fill: "forwards" });
      anim.onfinish = function () { el.remove(); };
    }

    function schedule() {
      var r = Math.random();
      var kind = r < 0.55 ? "star" : (r < 0.78 ? "comet" : "asteroid");
      spawn(kind);
      setTimeout(schedule, rand(2200, 5200));
    }
    setTimeout(schedule, rand(600, 1600));
  })();
  </script>

  <script>
  (function () {
    var host = document.getElementById("particles");
    if (!host || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#94a3b8", "#38bdf8", "#c084fc", "#facc15", "#e2e8f0"];
    var n = Math.min(28, Math.max(14, Math.floor(window.innerWidth / 50)));
    for (var i = 0; i < n; i++) {
      var p = document.createElement("span");
      p.className = "particle";
      var size = 2 + (Math.random() * 3) | 0;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.left = (Math.random() * 100) + "%";
      p.style.top = (Math.random() * 100) + "%";
      p.style.background = colors[(Math.random() * colors.length) | 0];
      p.style.opacity = (0.18 + Math.random() * 0.35).toFixed(2);
      var dx = (Math.random() * 80 - 40).toFixed(1);
      var dy = (40 + Math.random() * 120).toFixed(1);
      var dur = (18 + Math.random() * 28).toFixed(1);
      var delay = (-Math.random() * 20).toFixed(1);
      p.animate([
        { transform: "translate(0,0)", opacity: p.style.opacity },
        { transform: "translate(" + dx + "px," + dy + "px)", opacity: 0.05 }
      ], { duration: dur * 1000, delay: delay * 1000, iterations: Infinity, direction: "alternate", easing: "ease-in-out" });
      host.appendChild(p);
    }
  })();
  </script>
</body>
</html>
