body {

}

#canvas:focus {
	outline: none;
}

#status, #status-splash {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
}

#status {
	background-color: #00123a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status::before {
	content: "";
	position: absolute;
	inset: 0;
	background: rgba(0, 0, 0, 0.35);
	pointer-events: none;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	pointer-events: none;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress {
	display: none !important;
}

#status-loading {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	z-index: 1;
	display: none;
	/* Reserve full "LOADING..." width so dots don't shift the label */
	width: 11ch;
	box-sizing: content-box;
	font-family: "Press Start 2P", monospace;
	font-size: clamp(18px, 3.4vw, 36px);
	line-height: 1.35;
	color: #ffffff;
	text-align: left;
	letter-spacing: 0.02em;
	image-rendering: pixelated;
	user-select: none;
	white-space: pre;
	pointer-events: none;
}

#status-notice {
	display: none;
	position: relative;
	z-index: 1;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;

		<div id="status">

			<div id="status-loading" aria-live="polite">LOADING.</div>

			<div id="status-notice"></div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7634852,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
		const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusLoading = document.getElementById('status-loading');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let loadingDots = 1;
	let loadingTimer = null;
	const LOADING_BASE = 'LOADING';
	const DOT_INTERVAL_MS = 450;

	function refreshLoadingLabel() {
		if (!statusLoading) {
			return;
		}
		// Always occupy 3 dot slots (nbsp when empty) so the label stays centered.
		const dots = loadingDots;
		let tail = '';
		for (let i = 1; i <= 3; i++) {
			tail += i <= dots ? '.' : '\u00A0';
		}
		statusLoading.textContent = LOADING_BASE + tail;
	}

	function startLoadingDots() {
		if (loadingTimer !== null) {
			return;
		}
		loadingDots = 1;
		refreshLoadingLabel();
		loadingTimer = window.setInterval(function () {
			loadingDots = loadingDots >= 3 ? 1 : loadingDots + 1;
			refreshLoadingLabel();
		}, DOT_INTERVAL_MS);
	}

	function stopLoadingDots() {
		if (loadingTimer !== null) {
			window.clearInterval(loadingTimer);
			loadingTimer = null;
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			stopLoadingDots();
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		if (statusLoading) {
			statusLoading.style.display = mode === 'progress' ? 'block' : 'none';
		}
		if (mode === 'progress') {
			startLoadingDots();
		} else {
			stopLoadingDots();
		}
		statusProgress.style.display = 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (_current, _total) {
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
