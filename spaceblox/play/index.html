		<style>
@font-face {
	font-family: "Press Start 2P";
	src: url("PressStart2P.ttf") format("truetype");
	font-weight: 400;
	font-style: normal;
	font-display: block;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	color: white;
	background-color: #00123a;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
}

#status {
	background-color: #00123a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

/* Match in-game LoadingOverlay dim on the boot void. */
#status::before {
	content: "";
	position: absolute;
	inset: 0;
	background: rgba(0, 0, 0, 0.35);
	pointer-events: none;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	pointer-events: none;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress {
	display: none !important;
}

#status-loading {
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	z-index: 1;
	display: none;
	font-family: "Press Start 2P", monospace;
	/* 36px on the 1080×1920 game view, same scale the in-game label uses. */
	font-size: clamp(12px, min(3.333vw, 1.875vh), 36px);
	line-height: 1.35;
	color: #ffffff;
	text-align: left;
	letter-spacing: 0.02em;
	image-rendering: pixelated;
	user-select: none;
	white-space: pre;
	pointer-events: none;
}

#status-loading .loading-dot {
	display: inline-block;
	opacity: 0;
	will-change: opacity;
	animation-duration: 1.8s;
	animation-timing-function: linear;
	animation-iteration-count: infinite;
}

#status-loading .loading-dot:nth-of-type(1) { animation-name: loading-dot-1; }
#status-loading .loading-dot:nth-of-type(2) { animation-name: loading-dot-2; }
#status-loading .loading-dot:nth-of-type(3) { animation-name: loading-dot-3; }

/* Four 0.45s steps: one dot, two, three, then blank. Opacity keeps moving while wasm compiles. */
@keyframes loading-dot-1 {
	0%, 74.99% { opacity: 1; }
	75%, 100% { opacity: 0; }
}
@keyframes loading-dot-2 {
	0%, 24.99% { opacity: 0; }
	25%, 74.99% { opacity: 1; }
	75%, 100% { opacity: 0; }
}
@keyframes loading-dot-3 {
	0%, 49.99% { opacity: 0; }
	50%, 74.99% { opacity: 1; }
	75%, 100% { opacity: 0; }
}

#status-notice {
	display: none;
	position: relative;
	z-index: 1;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-loading" aria-label="Loading">LOADING<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7707092,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// Adopt service-worker updates during this load. The export plugin makes
	// index.pck network-first and claims clients, so a stale pack cannot stick
	// after a publish. Registration is idempotent when a worker already exists.
	// Reload once when a worker takes control. client.navigate() from the worker
	// throws on a client it does not control yet; this page hook is the reload.
	if ('serviceWorker' in navigator && GODOT_CONFIG['serviceWorker']) {
		var reloadedForWorker = false;
		navigator.serviceWorker.addEventListener('controllerchange', function () {
			if (reloadedForWorker) {
				return;
			}
			reloadedForWorker = true;
			window.location.reload();
		});
		navigator.serviceWorker.register(GODOT_CONFIG['serviceWorker']).catch(function (err) {
			console.error('Error while registering service worker:', err);
		});
	}

	const canvas = document.getElementById('canvas');
	const baseAspect = 1080 / 1920;

	// canvas_resize_policy 0: Godot uses the canvas buffer as the window.
	function fitPlayCanvas() {
		const vw = window.innerWidth;
		const vh = window.innerHeight;
		if (vw < 1 || vh < 1) {
			return;
		}
		let cssW = vw;
		let cssH = vh;
		if (vw / vh > baseAspect) {
			cssH = vh;
			cssW = Math.min(vw, Math.round(vh * baseAspect));
		}
		const scale = window.devicePixelRatio || 1;
		const bufW = Math.max(1, Math.floor(cssW * scale));
		const bufH = Math.max(1, Math.floor(cssH * scale));
		if (canvas.width !== bufW) {
			canvas.width = bufW;
		}
		if (canvas.height !== bufH) {
			canvas.height = bufH;
		}
		canvas.style.position = 'absolute';
		canvas.style.width = cssW + 'px';
		canvas.style.height = cssH + 'px';
		canvas.style.left = Math.floor((vw - cssW) / 2) + 'px';
		canvas.style.top = Math.floor((vh - cssH) / 2) + 'px';
	}

	window.addEventListener('resize', fitPlayCanvas);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitPlayCanvas);
	}
	fitPlayCanvas();

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusLoading = document.getElementById('status-loading');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		if (statusLoading) {
			statusLoading.style.display = mode === 'progress' ? 'block' : 'none';
		}
		statusProgress.style.display = 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Paint the CSS dots before wasm compilation blocks the main thread.
		const start = () => {
			engine.startGame({
				'onProgress': function (_current, _total) {
					// Keep the animated LOADING label; no native progress bar.
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		};
		requestAnimationFrame(() => requestAnimationFrame(start));
	}
}());
		</script>
