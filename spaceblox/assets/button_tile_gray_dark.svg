<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Soft depth lip (not pure black) -->
  <rect x="1" y="1" width="14" height="14" fill="#1a1a1a"/>
  <!-- Main face -->
  <rect x="1" y="1" width="14" height="13" fill="#2a2a2a"/>
  <!-- Top / left highlights -->
  <rect x="1" y="1" width="13" height="1" fill="#4a4a4a"/>
  <rect x="1" y="2" width="1" height="11" fill="#4a4a4a"/>
  <!-- Bottom / right shadows -->
  <rect x="2" y="13" width="13" height="1" fill="#121212"/>
  <rect x="14" y="2" width="1" height="12" fill="#121212"/>
</svg>
