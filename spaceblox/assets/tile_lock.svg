<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="120" height="120" shape-rendering="crispEdges">
  <!-- Standalone Tiny Lock (Moved down by 1, now positioned at 5,5 inside the core) -->
  <g transform="translate(5,5)">
    <!-- Shackle: Light Gray/White -->
    <rect x="2" y="0" width="2" height="1" fill="#ffffff" />
    <rect x="1" y="1" width="1" height="2" fill="#ffffff" />
    <rect x="4" y="1" width="1" height="2" fill="#ffffff" />
    
    <!-- Lock Body: Dark Metallic Grays -->
    <rect x="0" y="3" width="6" height="4" fill="#3a3a3a" /> <!-- Base body -->
    <rect x="1" y="4" width="4" height="1" fill="#7d7d7d" /> <!-- Inner metal shine -->
    <rect x="2" y="5" width="2" height="1" fill="#1a1a1a" /> <!-- Keyhole slot -->
  </g>
</svg>
