<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Head (Bottom-Left) -->
  <rect x="2" y="12" width="2" height="2" fill="#ffffff" />
  
  <!-- Tapering tail (Trailing Up and Right) -->
  <rect x="4" y="10" width="2" height="2" fill="#abffe6" />
  <rect x="6" y="8" width="2" height="2" fill="#abffe6" opacity="0.8" />
  <rect x="8" y="6" width="2" height="2" fill="#abffe6" opacity="0.6" />
  <rect x="10" y="4" width="1" height="2" fill="#abffe6" opacity="0.4" />
  <rect x="11" y="2" width="1" height="2" fill="#abffe6" opacity="0.2" />
</svg>
