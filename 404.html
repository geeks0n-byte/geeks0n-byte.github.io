<head>

  <title>Page not found – Spaceblox</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://geeks0n-byte.github.io/spaceblox/" />
  <style>body{font-family:system-ui,sans-serif;background:#00123a;color:#e8eefc;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}a{color:#7eb6ff}</style>
  <script>
  (function(){
    var p = location.pathname.replace(/\/+$/,'') || '/';
    var map = {
      '/about':'/spaceblox/about/',
      '/contact':'/spaceblox/contact/',
      '/devlog':'/spaceblox/devlog/',
      '/spaceblox':'/spaceblox/'
    };
    if (map[p]) { location.replace(map[p]); return; }
    if (p.indexOf('/devlog/')===0) { location.replace('/spaceblox'+p+(p.endsWith('/')?'':'/')); return; }
  })();
  </script>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>The Spaceblox site lives at <a href="/spaceblox/">/spaceblox/</a>.</p>

</body>
