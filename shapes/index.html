  <style>
    .hero {
      position: relative;
      min-height: calc(100dvh - 5.5rem);
      max-width: min(100%, 720px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.25rem;
      padding: 2.5rem 0 3rem;
    }

    .hero-brand {
      margin: 0;
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(3.4rem, 14vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .hero-brand span {
      display: block;
      background: linear-gradient(105deg, var(--ink) 0%, var(--mint) 45%, var(--coral) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 0;
      max-width: 28rem;
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      font-weight: 500;
      color: var(--muted);
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 0.35rem;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      color: #071018;
      background: var(--mint);
      padding: 0.9rem 1.25rem;
      border-radius: 999px;
      border: none;
      cursor: default;
    }

    .cta[aria-disabled="true"] {
      opacity: 0.85;
    }

    .cta-note {
      font-size: 0.9rem;
      color: var(--muted);
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-brand,
      .lead,
      .cta-row {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>

    </svg>

      <nav aria-label="Primary">

    <main class="hero">

      <div class="cta-row">
        <span class="cta" aria-disabled="true">Coming soon</span>

    </footer>
